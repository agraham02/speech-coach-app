# Supabase project settings used by the CLI (deploys only). Run
#   npx supabase login
#   npx supabase link --project-ref dtqbsdhjwmftwozstpwk
#   npx supabase functions deploy --use-api
# verify_jwt is off because every function checks the caller itself with
# auth.getUser (the platform check does not understand the new signing keys).

